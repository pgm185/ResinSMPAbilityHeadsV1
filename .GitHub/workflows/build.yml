name: Build ResinSMPAbilityHeads v1.2

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract v1.2 source ZIP
        run: |
          unzip -q ResinSMPAbilityHeads-v1.2-source.zip -d source

      - name: Locate Gradle project
        run: |
          find source -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts

      - name: Build plugin JAR
        run: |
          PROJECT_DIR="$(dirname "$(find source -name build.gradle.kts -o -name build.gradle | head -n 1)")"
          echo "Building project in: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" --no-daemon clean build
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ResinSMPAbilityHeads-v1.2
          path: |
            source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
